<h2>Paginas</h2>
<hr />

<h3 class="mt-3">
  <ul class="list-group">
    <li class="list-group-item">

      @for (item of reactiveMenu; track item.title) {
        <li
        [routerLink]="item.route"
        routerLinkActive="active"
        class="list-group-item">
          {{item.title}}
        </li>
      }

    </li>
  </ul>
</h3>
